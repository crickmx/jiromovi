# Construye MOVI aquí (en GitHub) y deja el resultado listo en la rama
# `beta-dist`, para que el servidor de Plesk NO tenga que compilar.
#
# ── Por qué existe ─────────────────────────────────────────────────────────
#
# Hasta ahora el Pull + Deploy de Plesk corría `npm ci` + `npm run build` EN EL
# SERVIDOR. Medido el 09/11: el build pide hasta 4 GB de heap y llega a un pico
# real de 2,184 MB. En un Plesk con MariaDB y Apache encima, eso invita al OOM
# killer de Linux, que mata al proceso más grande — casi siempre `mysqld`. De
# ahí el "se cae el servidor y hay que reiniciarlo" (y el 500 de Plesk del
# 06/11, con los tres sitios respondiendo pero la base muerta).
#
# Y lo más absurdo: `ci.yml` YA construía exactamente lo mismo en cada push a
# `main` para validar que compila... y tiraba el resultado. Se pagaba el build
# dos veces y se usaba el caro.
#
# ── Qué NO cambia ──────────────────────────────────────────────────────────
#
# Publicar a esta rama NO despliega nada. El sitio sigue cambiando solo cuando
# Ricardo da Pull + Deploy en Plesk, igual que hoy. Esto no revive el job
# `deploy-beta` que se quitó a propósito el 05/11.

name: Publicar beta

on:
  push:
    branches: [main]
  workflow_dispatch:        # también a mano, desde la pestaña Actions

permissions:
  contents: write           # hace falta para empujar la rama `beta-dist`

# Si entran dos pushes seguidos, el segundo cancela al primero: los dos
# terminarían empujando a la misma rama y ganaría el que acabe al último, que
# no tiene por qué ser el más nuevo.
concurrency:
  group: publicar-beta
  cancel-in-progress: true

jobs:
  construir-y-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Sin esto, un secret vacío produce un bundle que COMPILA pero que no
      # sabe a qué Supabase hablarle: el sitio carga en blanco y el deploy se
      # ve exitoso. Mejor fallar aquí, donde se nota.
      - name: Revisar que estén las variables
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BONOS_URL: ${{ secrets.VITE_BONOS_URL }}
        run: |
          faltan=""
          [ -n "$VITE_SUPABASE_URL" ]      || faltan="$faltan VITE_SUPABASE_URL"
          [ -n "$VITE_SUPABASE_ANON_KEY" ] || faltan="$faltan VITE_SUPABASE_ANON_KEY"
          [ -n "$VITE_BONOS_URL" ]         || faltan="$faltan VITE_BONOS_URL"
          if [ -n "$faltan" ]; then
            echo "Faltan estos secrets en el repositorio:$faltan"
            echo "Se cargan en Settings > Secrets and variables > Actions."
            exit 1
          fi

      # `.npmrc` del repo ya trae legacy-peer-deps=true, así que `npm ci` basta.
      - run: npm ci --no-audit --no-fund

      - name: Construir
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BONOS_URL: ${{ secrets.VITE_BONOS_URL }}
        run: npm run build

      # La barra naranja de beta lee /version.json. `vite.config.ts` ya toma el
      # commit de GITHUB_SHA cuando corre aquí, así que esto es solo para poder
      # verlo en el log si algo no cuadra.
      - name: Qué quedó construido
        run: |
          cat dist/version.json; echo
          du -sh dist

      # ⚠️ La rama lleva la CARPETA `dist/`, no su contenido pelado.
      #
      # Plesk deja los archivos de la rama en el directorio del repositorio
      # (`/var/www/vhosts/movi.digital/beta.movi.digital/`), y el document root
      # de beta es la subcarpeta `dist` de ahí. Publicando `dist/` completa, el
      # checkout la deja justo donde Apache busca. Si se publicara el contenido
      # suelto, `index.html` caería AL LADO del document root y el sitio
      # seguiría sirviendo el build anterior, sin que nada avisara.
      #
      # Y la rama no lleva NADA más: así el despliegue no toca el `.env` del
      # servidor ni ningún otro archivo que viva en esa carpeta.
      #
      # ⚠️ El commit CUELGA del commit de `main` que se construyó.
      #
      # El primer intento creaba la rama con `git init` dentro de una carpeta
      # aparte, o sea un historial huérfano sin ningún ancestro en común con
      # `main`. GitHub lo rechazó así:
      #
      #     remote: fatal error in commit_refs_rules
      #     ! [remote rejected] HEAD -> beta-dist
      #
      # No es el ruleset del repo —"Proteger main y produccion" solo cubre la
      # rama por defecto y `produccion`, con las reglas `deletion` y
      # `non_fast_forward`—: es que el evaluador de reglas de GitHub se atraganta
      # con una rama que no comparte historia con nada.
      #
      # Con `-p "$GITHUB_SHA"` el commit publicado desciende del commit real,
      # así que GitHub puede situarlo. De paso queda trazable: cada publicación
      # dice de qué commit de `main` salió.
      #
      # Se usa fontanería de git (índice temporal + write-tree + commit-tree) en
      # vez de un `git add` normal para no tocar el índice real del checkout, y
      # `add -f` porque el `.gitignore` del proyecto ignora `dist`.
      - name: Publicar a la rama beta-dist
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Índice aparte: así el árbol lleva SOLO dist/, sin el código fuente
          # ni el dist_backup que deja el postbuild.
          export GIT_INDEX_FILE="$(mktemp)"
          git read-tree --empty
          git add -f dist
          arbol="$(git write-tree)"

          # Cinturón: que la raíz del árbol sea exactamente una carpeta `dist`.
          # Si esto cambiara, los archivos caerían al lado del document root y
          # el sitio seguiría sirviendo el build anterior sin avisar.
          if [ "$(git ls-tree --name-only "$arbol")" != "dist" ]; then
            echo "La raíz del árbol no es solo dist/:"
            git ls-tree --name-only "$arbol"
            exit 1
          fi

          commit="$(git commit-tree "$arbol" -p "$GITHUB_SHA" -m "build de ${GITHUB_SHA:0:8}")"
          git push -f origin "$commit:refs/heads/beta-dist"
          echo "Publicado $(git ls-tree -r --name-only "$arbol" | wc -l) archivos."
          echo "En Plesk: Pull + Deploy sobre la rama beta-dist."
