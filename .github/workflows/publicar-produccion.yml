# Construye MOVI aquí (en GitHub) y deja el resultado listo en la rama
# `produccion-dist`, para que el servidor de Plesk NO tenga que compilar.
#
# ── Por qué existe ─────────────────────────────────────────────────────────
#
# Es el equivalente para producción de `publicar-beta.yml`. El Deploy de Plesk
# del sitio app.movi.digital corría `npm install` + `vite build` (4 GB de heap)
# EN EL SERVIDOR. El 24-nov-2026 ese build dejó el host entero sin HTTP ni SSH
# —el panel de Plesk solo contestaba un 302 estático y fue degradándose de
# 0,25 s a 14 s— y hubo que reiniciarlo desde el panel del proveedor (IONOS).
# Ya estaba anotado desde el 09/11: "al hacer pull y deploy, seguido se cae el
# servidor y hay que reiniciarlo", y el `syslog` guarda un
# `Out of memory: Killed process (node)` del mismo servidor.
#
# Por eso las acciones post-deploy del repo de producción quedaron VACÍAS el
# 24-nov-2026: un Pull + Deploy solo sincroniza el código y deja intacto el
# `dist/`. Este workflow es de donde sale ese `dist/`.
#
# ── Qué NO cambia ──────────────────────────────────────────────────────────
#
# Publicar a esta rama NO despliega nada. El sitio cambia cuando alguien da
# Pull + Deploy en Plesk (sitio 53, rama `produccion-dist`).

name: Publicar produccion

on:
  push:
    branches: [produccion]
  workflow_dispatch:        # también a mano, desde la pestaña Actions

permissions:
  contents: write           # hace falta para empujar la rama `produccion-dist`

# Si entran dos pushes seguidos, el segundo cancela al primero: los dos
# terminarían empujando a la misma rama y ganaría el que acabe al último, que
# no tiene por qué ser el más nuevo.
concurrency:
  group: publicar-produccion
  cancel-in-progress: true

jobs:
  construir-y-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Sin esto, un secret vacío produce un bundle que COMPILA pero que no
      # sabe a qué Supabase hablarle: el sitio carga en blanco y el deploy se
      # ve exitoso. Mejor fallar aquí, donde se nota.
      - name: Revisar que estén las variables
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BONOS_URL: ${{ secrets.VITE_BONOS_URL }}
        run: |
          faltan=""
          [ -n "$VITE_SUPABASE_URL" ]      || faltan="$faltan VITE_SUPABASE_URL"
          [ -n "$VITE_SUPABASE_ANON_KEY" ] || faltan="$faltan VITE_SUPABASE_ANON_KEY"
          [ -n "$VITE_BONOS_URL" ]         || faltan="$faltan VITE_BONOS_URL"
          if [ -n "$faltan" ]; then
            echo "Faltan estos secrets en el repositorio:$faltan"
            echo "Se cargan en Settings > Secrets and variables > Actions."
            exit 1
          fi

      # `.npmrc` del repo ya trae legacy-peer-deps=true, así que `npm ci` basta.
      - run: npm ci --no-audit --no-fund

      - name: Construir
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BONOS_URL: ${{ secrets.VITE_BONOS_URL }}
        run: npm run build

      - name: Qué quedó construido
        run: |
          cat dist/version.json; echo
          du -sh dist

      # ⚠️ La rama lleva la CARPETA `dist/`, no su contenido pelado.
      #
      # Plesk deja los archivos de la rama en el directorio de despliegue
      # (`/var/www/vhosts/movi.digital/httpdocs`) y el document root de
      # app.movi.digital es la subcarpeta `dist` de ahí. Publicando `dist/`
      # completa, el checkout la deja justo donde Apache busca.
      #
      # Y la rama no lleva NADA más: así el despliegue no toca el `.env` del
      # servidor ni ningún otro archivo que viva en esa carpeta.
      #
      # ⚠️ El commit CUELGA del commit de `produccion` que se construyó: una
      # rama con historial huérfano la rechaza el evaluador de reglas de
      # GitHub (`remote: fatal error in commit_refs_rules`).
      - name: Publicar a la rama produccion-dist
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Índice aparte: así el árbol lleva SOLO dist/, sin el código fuente
          # ni el dist_backup que deja el postbuild.
          export GIT_INDEX_FILE="$(mktemp)"
          git read-tree --empty
          git add -f dist
          arbol="$(git write-tree)"

          # Cinturón: que la raíz del árbol sea exactamente una carpeta `dist`.
          # Si esto cambiara, los archivos caerían al lado del document root y
          # el sitio seguiría sirviendo el build anterior sin avisar.
          if [ "$(git ls-tree --name-only "$arbol")" != "dist" ]; then
            echo "La raíz del árbol no es solo dist/:"
            git ls-tree --name-only "$arbol"
            exit 1
          fi

          commit="$(git commit-tree "$arbol" -p "$GITHUB_SHA" -m "build de ${GITHUB_SHA:0:8}")"
          git push -f origin "$commit:refs/heads/produccion-dist"
          echo "Publicado $(git ls-tree -r --name-only "$arbol" | wc -l) archivos."
          echo "En Plesk: Pull + Deploy sobre la rama produccion-dist."
