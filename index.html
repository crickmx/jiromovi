<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/movirecurso_7.png" />
    <link rel="apple-touch-icon" href="/movirecurso_7.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/fonts/gotham/gotham-book.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/gotham/gotham-medium.woff2" as="font" type="font/woff2" crossorigin />
    <title>MOVI Digital</title>
</head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        var h = window.location.hostname || '';
        if (h.indexOf('landing') !== -1) {
          document.documentElement.classList.add('dark');
          document.title = 'Mutuus Salud Inteligente | Membresía Médica';
          var r = document.getElementById('root');
          if (r) r.className = 'public-page';
          return;
        }
        var saved = localStorage.getItem('movi-theme-mode');
        if (!saved || saved === 'system') {
          localStorage.setItem('movi-theme-mode', 'light');
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
