    <div id="root" class="public-page" style="min-height: 100vh; background-color: #070D1E;"></div>
    <script>
      (function() {
        document.documentElement.classList.add('dark');
        var r = document.getElementById('root');
        if (r) r.className = 'public-page';
        var h = window.location.hostname || '';
        if (h.indexOf('landing') !== -1) {
          document.title = 'Mutuus Salud Inteligente | Membresía Médica';
          return;
        }
        var saved = localStorage.getItem('movi-theme-mode');
        if (!saved || saved === 'system') {
          localStorage.setItem('movi-theme-mode', 'light');
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
