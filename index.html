<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon — MOVI Digital -->
    <link rel="icon" type="image/png" href="/movirecurso_7.png" />
    <link rel="apple-touch-icon" href="/movirecurso_7.png" />
    <script>
      // Icono morado + badge solo en beta.movi.digital, para distinguir la pestaña.
      // Reemplaza el <link> por completo (no solo el href) porque el original
      // declara type="image/png" — dejarlo así hace que el navegador ignore el
      // SVG nuevo. El "?v=" evita que sirva el favicon viejo desde caché.
      if (location.hostname === 'beta.movi.digital') {
        var old = document.querySelector('link[rel="icon"]');
        if (old) old.remove();
        var link = document.createElement('link');
        link.rel = 'icon';
        link.type = 'image/svg+xml';
        link.href = '/favicon-beta.svg?v=2';
        document.head.appendChild(link);
      }
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOVI Digital</title>
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
  <body>
    <div id="root"></div>
    <script>
      // Migrate old "system" default → "light"
      (function() {
        var saved = localStorage.getItem('movi-theme-mode');
        if (!saved || saved === 'system') {
          localStorage.setItem('movi-theme-mode', 'light');
          document.documentElement.classList.remove('dark');
        }
      })();
      // Unregister old caching service workers but keep push-sw.js
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) {
            if (r.active && r.active.scriptURL && r.active.scriptURL.includes('push-sw.js')) return;
            r.unregister();
          });
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          keys.forEach(function(k) { caches.delete(k); });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
