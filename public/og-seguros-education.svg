<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040C1F"/>
      <stop offset="50%" stop-color="#081A38"/>
      <stop offset="100%" stop-color="#04101F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Logo -->
  <g transform="translate(100, 80)">
    <rect width="52" height="52" rx="16" fill="#0D6EFD"/>
    <!-- Graduation Cap -->
    <path d="M26 14 L40 22 L26 30 L12 22 Z" fill="#FFFFFF"/>
    <path d="M16 25 V33 C16 38 26 42 26 42 C26 42 36 38 36 33 V25" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M38 23 V36" stroke="#00C8E0" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="68" y="38" font-family="'Inter', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">Seguros <tspan fill="#0D6EFD">Education</tspan></text>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(100, 185)">
    <rect width="360" height="34" rx="17" fill="rgba(13,110,253,0.15)" stroke="rgba(13,110,253,0.3)"/>
    <text x="24" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#60A5FA">ACADEMIA PARA AGENTES</text>
  </g>

  <!-- Headline -->
  <text x="100" y="285" font-family="'Inter', sans-serif" font-size="50" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
    Capacitación continua para
  </text>
  <text x="100" y="350" font-family="'Inter', sans-serif" font-size="50" font-weight="900" fill="#00C8E0" letter-spacing="-1">
    agentes de seguros.
  </text>

  <text x="100" y="410" font-family="'Inter', sans-serif" font-size="20" fill="rgba(255,255,255,0.7)">
    Cursos On Demand 24/7, Aula Virtual en vivo, preparación oficial
  </text>
  <text x="100" y="440" font-family="'Inter', sans-serif" font-size="20" fill="rgba(255,255,255,0.7)">
    para Cédula A y convenios académicos con Universidad Quálitas y UTEL.
  </text>

  <!-- Pillars -->
  <g transform="translate(100, 495)">
    <rect width="180" height="55" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="20" y="24" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Modalidad</text>
    <text x="20" y="44" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#60A5FA">On Demand 24/7</text>

    <rect x="195" width="180" height="55" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="215" y="24" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Certificación</text>
    <text x="215" y="44" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#FACC15">Curso Cédula A</text>

    <rect x="390" width="180" height="55" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="410" y="24" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Alianzas</text>
    <text x="410" y="44" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#34D399">Quálitas &amp; UTEL</text>
  </g>
</svg>
