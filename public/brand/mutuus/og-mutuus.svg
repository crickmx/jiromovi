<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001B47"/>
      <stop offset="50%" stop-color="#003896"/>
      <stop offset="100%" stop-color="#001433"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9CD41C"/>
      <stop offset="100%" stop-color="#78B02A"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#9CD41C" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#003896" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Mutuus Official Logo Vector (White & Lime) -->
  <g transform="translate(100, 70)">
    <!-- Cross -->
    <path d="M30 6 H48 V27 H69 V45 H48 V66 H30 V45 H9 V27 H30 Z" fill="#9CD41C" rx="2"/>
    <path d="M30 6 C22 21 19 36 16 46 C13 55 9 64 16 72 C24 80 37 80 45 72 C49 66 48 58 43 57 C37 55 33 60 31 64 C30 68 25 70 21 67 C17 62 19 55 23 44 C27 35 29 21 30 6 Z" fill="#78B02A"/>
    <path d="M31 9 Q18 39 13 58 Q9 73 22 76 Q36 78 43 69 Q49 60 42 55" stroke="#9CD41C" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <circle cx="43" cy="53" r="5.5" fill="#9CD41C" stroke="#003896" stroke-width="2"/>
    <circle cx="43" cy="53" r="2.5" fill="#FFFFFF"/>

    <!-- Wordmark -->
    <text x="88" y="52" font-family="'Montserrat', system-ui, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-1">mutuus</text>
    <text x="89" y="74" font-family="'Montserrat', system-ui, sans-serif" font-size="11" font-weight="800" fill="#9CD41C" letter-spacing="3.5">SALUD INTELIGENTE.</text>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(100, 200)">
    <rect width="420" height="36" rx="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <circle cx="20" cy="18" r="5" fill="#9CD41C"/>
    <text x="36" y="23" font-family="'Montserrat', system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">CERO DEDUCIBLE · CERO COASEGURO</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="300" font-family="'Montserrat', system-ui, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">
    Membresía Médica y
  </text>
  <text x="100" y="365" font-family="'Montserrat', system-ui, sans-serif" font-size="52" font-weight="900" fill="#9CD41C" letter-spacing="-1.5">
    Gastos Médicos Mayores
  </text>

  <!-- Subtitle -->
  <text x="100" y="420" font-family="'Montserrat', system-ui, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.8)" width="680">
    Atención médica privada 24/7 y cobertura hospitalaria nacional
  </text>
  <text x="100" y="450" font-family="'Montserrat', system-ui, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.8)">
    con pago directo en más de 115 hospitales de México.
  </text>

  <!-- Key Value Props Bar -->
  <g transform="translate(100, 500)">
    <rect width="180" height="60" rx="16" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
    <text x="24" y="28" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,0.6)">Deducible en Red</text>
    <text x="24" y="49" font-family="'Montserrat', sans-serif" font-size="20" font-weight="900" fill="#9CD41C">$0 MXN</text>

    <rect x="200" width="180" height="60" rx="16" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
    <text x="224" y="28" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,0.6)">Videoconsulta</text>
    <text x="224" y="49" font-family="'Montserrat', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">Ilimitada 24/7</text>

    <rect x="400" width="200" height="60" rx="16" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
    <text x="424" y="28" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,0.6)">Red Hospitales</text>
    <text x="424" y="49" font-family="'Montserrat', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">+115 Directos</text>
  </g>

  <!-- Right Visual 3D Card Mockup -->
  <g transform="translate(740, 160)">
    <!-- Back Glow -->
    <rect width="360" height="380" rx="32" fill="#001433" stroke="rgba(255,255,255,0.2)" stroke-width="2" opacity="0.95"/>
    <rect x="20" y="20" width="320" height="340" rx="24" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
    
    <text x="45" y="65" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800" fill="#9CD41C" letter-spacing="1">PAGO DIRECTO EN RED</text>
    <text x="45" y="105" font-family="'Montserrat', sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">Cuenta Hospitalaria</text>
    <text x="45" y="135" font-family="'Montserrat', sans-serif" font-size="15" font-weight="600" fill="rgba(255,255,255,0.6)">Ejemplo real $705,500 MXN</text>

    <!-- Traditional comparison -->
    <rect x="45" y="160" width="270" height="58" rx="14" fill="rgba(255,255,255,0.08)"/>
    <text x="60" y="184" font-family="'Montserrat', sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Seguro Tradicional</text>
    <text x="60" y="204" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Deducible + Coaseguro</text>
    <text x="235" y="196" font-family="'Montserrat', sans-serif" font-size="15" font-weight="900" fill="#FCA5A5">$60,000</text>

    <!-- Mutuus Card -->
    <rect x="45" y="232" width="270" height="74" rx="16" fill="#9CD41C"/>
    <text x="60" y="258" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" fill="#001B47">Con Membresía Mutuus</text>
    <text x="60" y="282" font-family="'Montserrat', sans-serif" font-size="14" font-weight="900" fill="#001B47">Pago en Red de Convenio</text>
    <text x="230" y="280" font-family="'Montserrat', sans-serif" font-size="28" font-weight="900" fill="#001B47">$0</text>

    <!-- Badge -->
    <text x="80" y="335" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,0.7)">✓ 100% Digital · Emisión Inmediata</text>
  </g>
</svg>
