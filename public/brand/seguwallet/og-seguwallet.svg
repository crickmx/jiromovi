<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040C1F"/>
      <stop offset="50%" stop-color="#081A44"/>
      <stop offset="100%" stop-color="#0A2260"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C37E0"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Glow orbs -->
  <circle cx="1000" cy="200" r="300" fill="#1C37E0" opacity="0.3" filter="url(#blur)"/>
  <circle cx="200" cy="500" r="250" fill="#00E5FF" opacity="0.15" filter="url(#blur)"/>

  <!-- Logo Seguwallet -->
  <g transform="translate(80, 80)">
    <rect width="56" height="56" rx="16" fill="#1C37E0"/>
    <path d="M28 14 L42 22 V34 C42 42 36 48 28 50 C20 48 14 42 14 34 V22 Z" fill="#00E5FF" opacity="0.9"/>
    <text x="72" y="40" font-family="'Inter', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">seguwallet<tspan fill="#00E5FF">.mx</tspan></text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="260" font-family="'Inter', sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
    Tu Cartera Digital de Seguros
  </text>
  <text x="80" y="325" font-family="'Inter', sans-serif" font-size="48" font-weight="900" fill="url(#glow)" letter-spacing="-1">
    y Asistencia Inmediata 24/7
  </text>

  <!-- Subtitle -->
  <text x="80" y="390" font-family="'Inter', sans-serif" font-size="22" font-weight="400" fill="#94A3B8">
    Reúne todas tus pólizas, vigencias y recibos de cualquier aseguradora en tu celular.
  </text>

  <!-- Badges -->
  <g transform="translate(80, 450)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="310" height="54" rx="27" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="28" cy="27" r="10" fill="#00E5FF"/>
    <text x="50" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Acceso sin Contraseñas (OTP)</text>

    <!-- Pill 2 -->
    <rect x="330" y="0" width="280" height="54" rx="27" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="358" cy="27" r="10" fill="#3B82F6"/>
    <text x="380" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Chava IA Copilot 24/7</text>

    <!-- Pill 3 -->
    <rect x="630" y="0" width="280" height="54" rx="27" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="658" cy="27" r="10" fill="#10B981"/>
    <text x="680" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">+12 Aseguradoras</text>
  </g>
</svg>
