<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background with dark navy gradient -->
  <rect width="1200" height="630" fill="#040C1F" />
  <circle cx="1050" cy="180" r="400" fill="#1C37E0" opacity="0.35" filter="blur(90px)" />
  <circle cx="200" cy="520" r="300" fill="#00E5FF" opacity="0.18" filter="blur(80px)" />

  <!-- Grid overlay -->
  <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1" />
  <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1" />

  <!-- Badge Top -->
  <g transform="translate(80, 70)">
    <rect width="360" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.06" stroke="#00E5FF" stroke-opacity="0.3" />
    <circle cx="24" cy="21" r="5" fill="#00E5FF" />
    <text x="40" y="27" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#00E5FF" letter-spacing="1.5">CARTERA DIGITAL DE SEGUROS</text>
  </g>

  <!-- Wordmark Seguwallet -->
  <g transform="translate(80, 160)">
    <text x="0" y="60" font-family="'Inter', sans-serif" font-size="68" font-weight="900" fill="#FFFFFF">segu<tspan fill="#00E5FF">wallet</tspan></text>
  </g>

  <!-- Headline -->
  <text x="80" y="320" font-family="'Inter', sans-serif" font-size="46" font-weight="900" fill="#FFFFFF">Todas tus pólizas en un solo lugar.</text>
  <text x="80" y="375" font-family="'Inter', sans-serif" font-size="46" font-weight="900" fill="#5B78FF">Siempre contigo.</text>

  <!-- Subtitle -->
  <text x="80" y="435" font-family="'Inter', sans-serif" font-size="20" font-weight="400" fill="#94A3B8">Consulta vigencias, descarga pólizas en PDF y reporta siniestros 24/7 con Chava IA.</text>

  <!-- Feature Pills Footer -->
  <g transform="translate(80, 500)">
    <rect width="210" height="50" rx="25" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
    <text x="25" y="32" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">✓ Acceso sin Claves</text>

    <rect x="230" width="220" height="50" rx="25" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
    <text x="255" y="32" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">✓ Asistencias 24/7</text>

    <rect x="470" width="220" height="50" rx="25" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
    <text x="495" y="32" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">✓ +12 Aseguradoras</text>

    <text x="960" y="32" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#00E5FF" text-anchor="end">seguwallet.mx</text>
  </g>
</svg>
