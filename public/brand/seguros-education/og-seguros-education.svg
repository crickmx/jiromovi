<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background with dark indigo gradient -->
  <rect width="1200" height="630" fill="#040C1F" />
  <circle cx="1050" cy="180" r="400" fill="#0D6EFD" opacity="0.35" filter="blur(90px)" />
  <circle cx="200" cy="500" r="300" fill="#00C8E0" opacity="0.2" filter="blur(80px)" />

  <!-- Badge Top -->
  <g transform="translate(80, 70)">
    <rect width="400" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.08" stroke="#0D6EFD" stroke-opacity="0.4" />
    <circle cx="24" cy="21" r="5" fill="#0D6EFD" />
    <text x="40" y="27" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" letter-spacing="1">ACADEMIA Y CERTIFICACIÓN DE SEGUROS</text>
  </g>

  <!-- Wordmark -->
  <g transform="translate(80, 160)">
    <text x="0" y="60" font-family="'Inter', sans-serif" font-size="62" font-weight="900" fill="#FFFFFF">Seguros <tspan fill="#0D6EFD">Education</tspan></text>
  </g>

  <!-- Headline -->
  <text x="80" y="320" font-family="'Inter', sans-serif" font-size="46" font-weight="900" fill="#FFFFFF">Capacitación continua para</text>
  <text x="80" y="375" font-family="'Inter', sans-serif" font-size="46" font-weight="900" fill="#00C8E0">agentes de seguros de alto nivel.</text>

  <!-- Subtitle -->
  <text x="80" y="435" font-family="'Inter', sans-serif" font-size="20" font-weight="400" fill="#94A3B8">Cursos On Demand 24/7, Aula Virtual en vivo, Cédula A y Alianzas Académicas.</text>

  <!-- Feature Pills Footer -->
  <g transform="translate(80, 500)">
    <rect width="200" height="50" rx="25" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15" />
    <text x="25" y="32" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">🎓 Cédula A</text>

    <rect x="220" width="220" height="50" rx="25" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15" />
    <text x="245" y="32" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">💻 On Demand 24/7</text>

    <rect x="460" width="220" height="50" rx="25" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15" />
    <text x="485" y="32" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">📹 Aula Virtual</text>

    <text x="960" y="32" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#0D6EFD" text-anchor="end">seguros.education</text>
  </g>
</svg>
