<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040C1F"/>
      <stop offset="50%" stop-color="#061428"/>
      <stop offset="100%" stop-color="#081A38"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D6EFD"/>
      <stop offset="100%" stop-color="#00C8E0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="180" r="280" fill="#0D6EFD" opacity="0.25"/>

  <!-- Logo -->
  <g transform="translate(80, 80)">
    <text x="0" y="45" font-family="'Inter', sans-serif" font-size="40" font-weight="900" fill="#FFFFFF">seguros<tspan fill="#00C8E0">.education</tspan></text>
  </g>

  <!-- Headline -->
  <text x="80" y="270" font-family="'Inter', sans-serif" font-size="52" font-weight="900" fill="#FFFFFF">
    Capacitación Continua para
  </text>
  <text x="80" y="340" font-family="'Inter', sans-serif" font-size="52" font-weight="900" fill="url(#blueGrad)">
    Agentes de Seguros y Fianzas
  </text>

  <text x="80" y="410" font-family="'Inter', sans-serif" font-size="22" font-weight="400" fill="#94A3B8">
    Cursos On Demand 24/7, Aula Virtual en vivo, Curso Cédula A y Alianzas Académicas.
  </text>

  <!-- Badges -->
  <g transform="translate(80, 470)">
    <rect x="0" y="0" width="280" height="54" rx="27" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="40" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Certificación Cédula A</text>

    <rect x="300" y="0" width="290" height="54" rx="27" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="330" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Universidad Quálitas & UTEL</text>
  </g>
</svg>
