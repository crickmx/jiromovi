<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background with deep emerald-blue gradient -->
  <rect width="1200" height="630" fill="#060F25" />
  <circle cx="1050" cy="180" r="400" fill="#00E5FF" opacity="0.25" filter="blur(90px)" />
  <circle cx="200" cy="500" r="300" fill="#10B981" opacity="0.2" filter="blur(80px)" />

  <!-- Badge Top -->
  <g transform="translate(80, 70)">
    <rect width="360" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.08" stroke="#00E5FF" stroke-opacity="0.4" />
    <circle cx="24" cy="21" r="5" fill="#00E5FF" />
    <text x="40" y="27" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#00E5FF" letter-spacing="1">IA PARA AGENTES DE SEGUROS</text>
  </g>

  <!-- Wordmark -->
  <g transform="translate(80, 160)">
    <text x="0" y="60" font-family="'Manrope', sans-serif" font-size="64" font-weight="900" fill="#FFFFFF">Chava <tspan fill="#00E5FF">IA</tspan></text>
  </g>

  <!-- Headline -->
  <text x="80" y="320" font-family="'Manrope', sans-serif" font-size="46" font-weight="900" fill="#FFFFFF">El copiloto de inteligencia artificial</text>
  <text x="80" y="375" font-family="'Manrope', sans-serif" font-size="46" font-weight="900" fill="#00E5FF">para asesores y equipos de seguros.</text>

  <!-- Subtitle -->
  <text x="80" y="435" font-family="'Manrope', sans-serif" font-size="20" font-weight="400" fill="#94A3B8">Dictamina pólizas, compara coberturas y resuelve consultas de clientes en segundos.</text>

  <!-- Feature Pills Footer -->
  <g transform="translate(80, 500)">
    <rect width="210" height="50" rx="25" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15" />
    <text x="25" y="32" font-family="'Manrope', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">🤖 Copilot 24/7</text>

    <rect x="230" width="220" height="50" rx="25" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15" />
    <text x="255" y="32" font-family="'Manrope', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">📊 Dictamen Pólizas</text>

    <rect x="470" width="220" height="50" rx="25" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15" />
    <text x="495" y="32" font-family="'Manrope', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">⚡ Respuestas Inmediatas</text>

    <text x="960" y="32" font-family="'Manrope', sans-serif" font-size="18" font-weight="800" fill="#00E5FF" text-anchor="end">agentedeseguros.ai</text>
  </g>
</svg>
