<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040C1F"/>
      <stop offset="50%" stop-color="#07194A"/>
      <stop offset="100%" stop-color="#020612"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C37E0"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/><line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/><line x1="1100" y1="0" x2="1100" y2="630"/>
  </g>

  <!-- Seguwallet Branding -->
  <g transform="translate(100, 80)">
    <rect width="56" height="56" rx="16" fill="url(#blue)"/>
    <path d="M28 16 L40 24 V36 C40 44 28 50 28 50 C28 50 16 44 16 36 V24 Z" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 33 L27 36 L33 30" fill="none" stroke="#00E5FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="72" y="42" font-family="'Inter', system-ui, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Seguwallet</text>
    <text x="270" y="28" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#00E5FF">CARTERA DIGITAL</text>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(100, 195)">
    <rect width="360" height="34" rx="17" fill="rgba(0,229,255,0.1)" stroke="rgba(0,229,255,0.3)" stroke-width="1"/>
    <circle cx="18" cy="17" r="4.5" fill="#00E5FF"/>
    <text x="32" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#00E5FF" letter-spacing="1">LA APP DE TUS SEGUROS</text>
  </g>

  <!-- Headline -->
  <text x="100" y="295" font-family="'Inter', system-ui, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">
    Todas tus Pólizas en
  </text>
  <text x="100" y="360" font-family="'Inter', system-ui, sans-serif" font-size="52" font-weight="900" fill="#00E5FF" letter-spacing="-1.5">
    un solo lugar.
  </text>

  <!-- Description -->
  <text x="100" y="415" font-family="'Inter', system-ui, sans-serif" font-size="19" font-weight="400" fill="rgba(255,255,255,0.7)">
    Consulta vigencias, descarga carátulas y recibos en PDF,
  </text>
  <text x="100" y="445" font-family="'Inter', system-ui, sans-serif" font-size="19" font-weight="400" fill="rgba(255,255,255,0.7)">
    reporta siniestros y resuelve dudas 24/7 con Chava IA.
  </text>

  <!-- Props -->
  <g transform="translate(100, 495)">
    <rect width="180" height="55" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="20" y="25" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Acceso</text>
    <text x="20" y="44" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#00E5FF">Sin Contraseña</text>

    <rect x="195" width="180" height="55" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="215" y="25" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Aseguradoras</text>
    <text x="215" y="44" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">+12 Conectadas</text>

    <rect x="390" width="180" height="55" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="410" y="25" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Asistencia</text>
    <text x="410" y="44" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Chava IA 24/7</text>
  </g>

  <!-- Right Visual Phone Mockup -->
  <g transform="translate(760, 100)">
    <rect width="340" height="460" rx="36" fill="#0A1633" stroke="#1C2A4D" stroke-width="6"/>
    <!-- Mockup header -->
    <rect x="20" y="30" width="300" height="60" rx="16" fill="#1C37E0"/>
    <text x="40" y="58" font-family="'Inter', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">Mi Cartera</text>
    <text x="40" y="76" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">3 Pólizas Activas</text>

    <!-- Cards -->
    <rect x="20" y="105" width="300" height="70" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <text x="40" y="132" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Auto · GNP Cobertura Amplia</text>
    <text x="40" y="152" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Vigencia 2026 · Pagada</text>

    <rect x="20" y="190" width="300" height="70" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <text x="40" y="217" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">GMM · Quálitas Salud</text>
    <text x="40" y="237" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Deducible $15,000 · Coaseguro 10%</text>

    <!-- Chava message -->
    <rect x="20" y="275" width="300" height="90" rx="16" fill="rgba(0,229,255,0.08)" stroke="rgba(0,229,255,0.2)"/>
    <text x="40" y="305" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#00E5FF">🤖 Chava IA</text>
    <text x="40" y="325" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255,255,255,0.8)">¿Necesitas asistencia en carretera o reporte?</text>
    <text x="40" y="342" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255,255,255,0.8)">Estoy disponible 24/7.</text>

    <rect x="20" y="380" width="300" height="44" rx="14" fill="#1C37E0"/>
    <text x="100" y="407" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Ingresar a Seguwallet</text>
  </g>
</svg>
