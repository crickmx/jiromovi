<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040C1F"/>
      <stop offset="50%" stop-color="#0E2355"/>
      <stop offset="100%" stop-color="#040C1F"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Logo -->
  <g transform="translate(100, 80)">
    <rect width="48" height="48" rx="14" fill="#2563EB"/>
    <path d="M26 12 L14 28 H24 L22 36 L34 20 H24 Z" fill="#FACC15"/>
    <text x="64" y="36" font-family="'Sora', system-ui, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">seguros<tspan fill="#60A5FA">.express</tspan></text>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(100, 180)">
    <rect width="320" height="34" rx="17" fill="rgba(37,99,235,0.15)" stroke="rgba(37,99,235,0.4)"/>
    <text x="24" y="22" font-family="'Sora', sans-serif" font-size="12" font-weight="800" fill="#93C5FD">ASESORES CERCA DE TI</text>
  </g>

  <!-- Headline -->
  <text x="100" y="280" font-family="'Sora', system-ui, sans-serif" font-size="50" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
    Tu seguro, con un asesor
  </text>
  <text x="100" y="345" font-family="'Sora', system-ui, sans-serif" font-size="50" font-weight="900" fill="#60A5FA" letter-spacing="-1">
    cercano y real.
  </text>

  <text x="100" y="410" font-family="'Sora', sans-serif" font-size="20" fill="rgba(255,255,255,0.75)">
    Cotiza y compara seguros de auto con las mejores aseguradoras de México.
  </text>
  <text x="100" y="440" font-family="'Sora', sans-serif" font-size="20" fill="rgba(255,255,255,0.75)">
    Atención personalizada sin intermediarios ni call centers.
  </text>

  <!-- Stats -->
  <g transform="translate(100, 500)">
    <rect width="170" height="55" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="20" y="24" font-family="'Sora', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Red Nacional</text>
    <text x="20" y="44" font-family="'Sora', sans-serif" font-size="16" font-weight="800" fill="#FACC15">+320 Asesores</text>

    <rect x="185" width="170" height="55" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="205" y="24" font-family="'Sora', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Cobertura</text>
    <text x="205" y="44" font-family="'Sora', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">32 Estados</text>

    <rect x="370" width="170" height="55" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="390" y="24" font-family="'Sora', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Cotización</text>
    <text x="390" y="44" font-family="'Sora', sans-serif" font-size="16" font-weight="800" fill="#34D399">100% Gratis</text>
  </g>
</svg>
