<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040C1F"/>
      <stop offset="50%" stop-color="#061E38"/>
      <stop offset="100%" stop-color="#020612"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Logo -->
  <g transform="translate(100, 80)">
    <rect width="52" height="52" rx="16" fill="#10B981"/>
    <circle cx="26" cy="26" r="12" fill="#FFFFFF"/>
    <circle cx="22" cy="24" r="3" fill="#10B981"/>
    <circle cx="30" cy="24" r="3" fill="#10B981"/>
    <path d="M20 30 Q26 35 32 30" stroke="#10B981" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="68" y="38" font-family="'Manrope', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">Chava <tspan fill="#10B981">IA Copilot</tspan></text>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(100, 185)">
    <rect width="380" height="34" rx="17" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)"/>
    <text x="24" y="22" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#34D399">INTELIGENCIA ARTIFICIAL ASEGURADORA</text>
  </g>

  <!-- Headline -->
  <text x="100" y="285" font-family="'Manrope', sans-serif" font-size="50" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
    El copiloto de IA para
  </text>
  <text x="100" y="350" font-family="'Manrope', sans-serif" font-size="50" font-weight="900" fill="#34D399" letter-spacing="-1">
    agentes de seguros.
  </text>

  <text x="100" y="410" font-family="'Manrope', sans-serif" font-size="20" fill="rgba(255,255,255,0.75)">
    Dictamina pólizas, resuelve dudas de condicionados, cotiza y atiende
  </text>
  <text x="100" y="440" font-family="'Manrope', sans-serif" font-size="20" fill="rgba(255,255,255,0.75)">
    a tus clientes 24/7 con el motor de IA líder del mercado.
  </text>

  <!-- Pillars -->
  <g transform="translate(100, 495)">
    <rect width="180" height="55" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="20" y="24" font-family="'Manrope', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Velocidad</text>
    <text x="20" y="44" font-family="'Manrope', sans-serif" font-size="16" font-weight="800" fill="#34D399">Respuestas en 1s</text>

    <rect x="195" width="180" height="55" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="215" y="24" font-family="'Manrope', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Conocimiento</text>
    <text x="215" y="44" font-family="'Manrope', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">+20 Aseguradoras</text>

    <rect x="390" width="180" height="55" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="410" y="24" font-family="'Manrope', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Integración</text>
    <text x="410" y="44" font-family="'Manrope', sans-serif" font-size="16" font-weight="800" fill="#60A5FA">WhatsApp &amp; Web</text>
  </g>
</svg>
